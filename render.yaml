services:
  - type: web
    name: sagar-mitra-backend
    env: python
    region: singapore
    plan: free
    rootDir: Sagar-mitra/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
