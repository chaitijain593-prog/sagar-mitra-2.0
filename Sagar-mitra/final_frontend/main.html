<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagar Mitra — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#39bdf2;--blue2:#0da9df;--ink:#101820;--muted:#657783;--line:#ccecf7}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"DM Sans",sans-serif}
body{transition:opacity .5s ease,transform .5s ease}
body.page-exit{opacity:0;transform:translateX(-8vw)}
body.page-enter{animation:enter .65s ease both}
@keyframes enter{from{opacity:0;transform:translateX(8vw)}to{opacity:1;transform:none}}

.page{width:100vw;height:100vh;position:relative;overflow:hidden}
.hero-video{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#fff}
.hero-video iframe{position:absolute;width:100%;height:177.78%;left:0;top:-38.89%;border:0;pointer-events:none}

.overlay{position:absolute;inset:0;background:rgba(255,255,255,.22);pointer-events:none}

.logo{position:fixed;top:24px;left:28px;width:88px;height:88px;object-fit:contain;z-index:20;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}

.actions{position:fixed;top:27px;right:28px;display:flex;align-items:center;gap:22px;z-index:30}

.logout,.nav-trigger{position:relative;width:48px;height:48px;border:0;background:rgba(255,255,255,.84);display:grid;place-items:center;cursor:pointer;border-radius:12px;transition:.2s}
.logout:hover,.nav-trigger:hover{background:#fff;transform:translateY(-2px)}
.logout svg{width:27px;height:27px;stroke:#ff4050;fill:none;stroke-width:2}
.nav-trigger{background:transparent}
.nav-trigger svg{width:31px;height:31px;fill:none;stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.tooltip{position:absolute;top:57px;right:0;background:#fff;color:var(--ink);font:12px "DM Mono",monospace;padding:7px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.2s}
.logout:hover .tooltip,.nav-trigger:hover .tooltip{opacity:1;transform:none}

.nav{position:fixed;right:88px;top:88px;width:max-content;min-width:410px;padding:17px 20px;display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.78);border:1px solid rgba(57,189,242,.65);backdrop-filter:blur(18px);border-radius:12px;box-shadow:0 8px 35px rgba(57,189,242,.20);z-index:10;cursor:grab;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transition:.22s}
.nav.open{opacity:1;visibility:visible;transform:none}
.nav.dragging{cursor:grabbing}
.nav:hover{z-index:100}
.nav a{flex:1;text-align:center;text-decoration:none;white-space:nowrap;color:#263943;font:600 13px "DM Mono",monospace;letter-spacing:1.4px;padding:12px 10px;border-radius:7px;transition:.2s}
.nav a:hover,.nav a.active{background:#e8f8fd;color:#079ed5}

.explore{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;color:#fff;font:600 12px "DM Mono",monospace;letter-spacing:2px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;padding:10px 22px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(14px);border-radius:30px;cursor:pointer;transition:all .25s ease;box-shadow:0 4px 20px rgba(0,0,0,.18)}
.explore:hover{background:rgba(255,255,255,.92);color:#075985;transform:translateX(-50%) translateY(-3px);box-shadow:0 8px 30px rgba(57,189,242,.45)}
.explore .explore-arrow{animation:bounceDown 1.8s infinite ease-in-out;display:inline-block;font-size:14px}
@keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

.arrows{position:fixed !important;bottom:24px !important;right:28px !important;display:flex;gap:8px;z-index:9999 !important}
.arrow{width:44px;height:44px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.8);color:#1c596d;border-radius:50% !important;cursor:pointer;font-size:20px;display:grid;place-items:center;transition:.2s;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.arrow:hover{background:#fff;transform:translateY(-2px)}

/* Wave/Ripple Swipe Transition Overlay */
.ocean-swipe-wave{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10001;overflow:hidden}
.ocean-swipe-wave::before{content:"";position:absolute;top:-20%;width:140vw;height:140vh;background:radial-gradient(ellipse at center, rgba(57,189,242,0.85) 0%, rgba(13,169,223,0.6) 40%, rgba(3,105,161,0.2) 70%, transparent 100%);box-shadow:0 0 80px rgba(57,189,242,0.7);filter:blur(6px)}
.ocean-swipe-wave.swipe-left::before{left:100vw;animation:waveWashLeft 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
.ocean-swipe-wave.swipe-right::before{right:100vw;animation:waveWashRight 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
@keyframes waveWashLeft{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(-220vw) scaleX(1.2);opacity:0}}
@keyframes waveWashRight{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(220vw) scaleX(1.2);opacity:0}}

.content{position:absolute;left:8vw;top:50%;transform:translateY(-50%);z-index:5;color:#fff;max-width:600px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.kicker{font:500 12px "DM Mono",monospace;letter-spacing:4px;margin-bottom:20px}
h1{font:400 clamp(55px,7vw,110px)/.87 "Playfair Display",serif;letter-spacing:-5px}
.sub{font:18px "Playfair Display",serif;margin-top:22px}

@media(max-width:700px){
.logo{width:65px;height:65px;top:16px;left:16px}
.actions{right:16px;top:16px;gap:5px}
.nav{right:16px;top:75px;width:calc(100vw - 32px)}
.content{left:7vw}
h1{font-size:17vw}
.explore{bottom:18px}
.arrows{right:16px;bottom:16px}
}
</style>
</head>

<body class="page-enter">
<main class="page">

<div class="hero-video">
<iframe src="https://www.youtube.com/embed/ALbM9_cF7YQ?autoplay=1&mute=1&controls=0&loop=1&playlist=ALbM9_cF7YQ&start=10&end=40&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0" allow="autoplay" tabindex="-1"></iframe>
</div>

<div class="overlay"></div>

<img src="assets/logo.svg" onerror="this.onerror=null;this.src='assets/logo.png';" class="logo" alt="Sagar Mitra">

<div class="actions">

<button class="nav-trigger" id="navTrigger" aria-label="Open navigation">
<svg viewBox="0 0 40 40">
<path d="M4 25c5-11 12-15 18-10 4 3 6 8 14 3"/>
<path d="M4 30c7-7 12-8 18-4 5 3 9 3 14-2"/>
</svg>
<span class="tooltip">Navigation</span>
</button>

<button class="logout" id="logout" aria-label="Log out">
<svg viewBox="0 0 32 32">
<path d="M13 5H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h6"/>
<path d="M18 10l7 6-7 6"/>
<path d="M25 16H11"/>
</svg>
<span class="tooltip">Log out</span>
</button>

</div>

<nav class="nav" id="nav">
<a href="main.html" class="active">HOME</a>
<a href="about.html">ABOUT US</a>
<a href="map.html">MAP</a>
<a href="chatbot.html">CHATBOT</a>
</nav>

<div class="content">
<div class="kicker">SAGAR MITRA</div>
<h1>Homepage</h1>
<div class="sub">Question the unexplored.</div>
</div>

<a href="about.html" class="explore" id="exploreBtn" aria-label="Explore About Us">
  <span>EXPLORE ABOUT US</span>
  <span class="explore-arrow">↓</span>
</a>

<div class="arrows">
<button class="arrow" id="prev" aria-label="Previous page">←</button>
<button class="arrow" id="next" aria-label="Next page">→</button>
</div>

</main>

<script>
const pages=["main.html","about.html","map.html","chatbot.html"];
const current=pages.indexOf(location.pathname.split("/").pop())<0?0:pages.indexOf(location.pathname.split("/").pop());
let nav=document.getElementById("nav"),trigger=document.getElementById("navTrigger");
let dragging=false,ox=0,oy=0,startX=0,startY=0,moved=false;

trigger.onclick=()=>nav.classList.toggle("open");

document.getElementById("logout").onclick=()=>{
 localStorage.removeItem("sagarMitraLoggedIn");
 document.body.classList.add("page-exit");
 setTimeout(()=>location.href="login.html",450);
};

let transitioning=false;
function triggerWaveTransition(dir, targetUrl){
  let wave = document.getElementById("oceanWaveOverlay");
  if(!wave){
    wave = document.createElement("div");
    wave.id = "oceanWaveOverlay";
    document.body.appendChild(wave);
  }
  wave.className = "ocean-swipe-wave " + (dir > 0 ? "swipe-left" : "swipe-right");

  document.body.style.transition = "transform 0.45s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.45s ease";
  document.body.style.transform = `translateX(${dir > 0 ? "-10vw" : "10vw"})`;
  document.body.style.opacity = "0";

  setTimeout(() => { location.href = targetUrl; }, 420);
}

function go(dir){
  const n=current+dir;
  if(n<0||n>=pages.length||transitioning)return;
  transitioning=true;
  triggerWaveTransition(dir, pages[n]);
}

document.getElementById("next").onclick=()=>go(1);
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("exploreBtn").onclick=(e)=>{
  e.preventDefault();
  go(1);
};

// Keyboard navigation
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="PageDown"||(e.ctrlKey&&e.key==="ArrowRight")){
    e.preventDefault();
    go(1);
  } else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"||(e.ctrlKey&&e.key==="ArrowLeft")){
    e.preventDefault();
    go(-1);
  }
});

// CTRL + 2-FINGER SWIPE: Horizontal page navigation
// Prevents normal vertical navigation from being affected
let swipeLock=false;
window.addEventListener("wheel",e=>{
  // Only trigger when Ctrl is held AND gesture is predominantly horizontal
  if(!e.ctrlKey) return; // Normal vertical navigation unaffected!
  if(Math.abs(e.deltaX) < 16 || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; // Normal vertical navigation unaffected!

  e.preventDefault();
  if(swipeLock || transitioning) return;

  const dir = e.deltaX > 0 ? 1 : -1; // deltaX > 0: swipe left (next page); deltaX < 0: swipe right (prev page)
  const n = current + dir;
  if(n < 0 || n >= pages.length) return;

  swipeLock = true;
  transitioning = true;
  triggerWaveTransition(dir, pages[n]);
},{passive:false});

// Touch swipe navigation for mobile & trackpads
let touchY=0, touchX=0;
window.addEventListener("touchstart",e=>{
 touchY=e.touches[0].clientY;
 touchX=e.touches[0].clientX;
},{passive:true});
window.addEventListener("touchend",e=>{
 const dy=touchY-e.changedTouches[0].clientY;
 const dx=touchX-e.changedTouches[0].clientX;
 if(dy>45||dx>45) go(1);
 else if(dy<-45||dx<-45) go(-1);
},{passive:true});

nav.addEventListener("pointerdown",e=>{
 if(e.target.closest("a"))return;
 dragging=true;
nav.classList.add("dragging");
startX=e.clientX;
startY=e.clientY;
const r=nav.getBoundingClientRect();
ox=r.left;
oy=r.top;
nav.setPointerCapture(e.pointerId);
});

nav.addEventListener("pointermove",e=>{
 if(!dragging)return;
 nav.style.left=ox+(e.clientX-startX)+"px";
 nav.style.top=oy+(e.clientY-startY)+"px";
 nav.style.right="auto";
});

nav.addEventListener("pointerup",()=>{
 if(!dragging)return;
 dragging=false;
 nav.classList.remove("dragging");
 localStorage.setItem("navX",nav.offsetLeft);
 localStorage.setItem("navY",nav.offsetTop);
});

const nx=localStorage.getItem("navX"),ny=localStorage.getItem("navY");
if(nx&&ny){
 nav.style.left=nx+"px";
 nav.style.top=ny+"px";
 nav.style.right="auto";
}
</script>
</body>
</html>
