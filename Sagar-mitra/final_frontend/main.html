<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagar Mitra — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root {
  --blue: #39bdf2;
  --blue2: #0da9df;
  --blue-glow: rgba(57, 189, 242, 0.45);
  --ink: #101820;
  --muted: #657783;
  --line: #ccecf7;
  --bg: #ffffff;
  --overlay-bg: rgba(255, 255, 255, 0.22);
  --ctrl-bg: rgba(255, 255, 255, 0.85);
  --ctrl-border: rgba(57, 189, 242, 0.4);
  --ctrl-text: #101820;
  --nav-bg: rgba(255, 255, 255, 0.82);
  --nav-border: rgba(57, 189, 242, 0.65);
  --nav-link: #263943;
  --brand-text: #ffffff;
}

[data-theme="dark"] {
  --blue: #38bdf8;
  --blue2: #0284c7;
  --blue-glow: rgba(56, 189, 248, 0.5);
  --ink: #f4f4f5;
  --muted: #9ca3af;
  --line: rgba(56, 189, 248, 0.3);
  --bg: #141413;
  --overlay-bg: rgba(18, 18, 17, 0.68);
  --ctrl-bg: rgba(26, 26, 24, 0.88);
  --ctrl-border: rgba(56, 189, 248, 0.35);
  --ctrl-text: #f4f4f5;
  --nav-bg: rgba(24, 24, 22, 0.90);
  --nav-border: rgba(56, 189, 248, 0.45);
  --nav-link: #d4d4d8;
  --brand-text: #f4f4f5;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;transition:background .3s ease,color .3s ease}
body{transition:opacity .5s ease,transform .5s ease}
body.page-exit{opacity:0;transform:translateX(-8vw)}
body.page-enter{animation:enter .65s ease both}
@keyframes enter{from{opacity:0;transform:translateX(8vw)}to{opacity:1;transform:none}}

/* Subtle cursor glow trail canvas */
#cursorTrailCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:99998;
}

.page{width:100vw;height:100vh;position:relative;overflow:hidden}
.hero-video{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.hero-video iframe{position:absolute;width:100%;height:177.78%;left:0;top:-38.89%;border:0;pointer-events:none}

.overlay{position:absolute;inset:0;background:var(--overlay-bg);pointer-events:none;transition:background .3s ease}

/* Logo & Rotating Brand Title aligned to navbar button height */
.brand-bar{
  position:fixed;
  top:27px;
  left:28px;
  height:48px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  z-index:30;
  text-decoration:none;
}
.brand-bar .logo{
  width:48px;
  height:48px;
  object-fit:contain;
  filter:drop-shadow(0 2px 8px rgba(57,189,242,.35));
  transition:transform .2s ease;
}
.brand-bar:hover .logo{transform:scale(1.05)}
.brand-title{
  height:48px;
  display:inline-flex;
  align-items:center;
  font:600 15px "DM Mono", "Nirmala UI", sans-serif;
  letter-spacing:2px;
  color:var(--brand-text);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
  transition:opacity .3s ease,transform .3s ease;
  white-space:nowrap;
  user-select:none;
}

/* Expanding Top-Right Controls */
.actions{
  position:fixed;
  top:27px;
  right:28px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:40;
}
.ctrl-btn{
  height:48px;
  border-radius:24px;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  backdrop-filter:blur(14px);
  box-shadow:0 3px 14px rgba(0,0,0,.08);
  color:var(--ctrl-text);
  overflow:hidden;
  transition:padding .3s cubic-bezier(0.2, 0.8, 0.2, 1),
              background .25s ease,
              border-color .25s ease,
              box-shadow .25s ease,
              transform .2s ease;
  white-space:nowrap;
  user-select:none;
}
.ctrl-icon{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  transition:transform .2s ease;
}
.ctrl-icon svg{
  width:22px;
  height:22px;
}
.nav-trigger .ctrl-icon svg{
  stroke:var(--blue);
}
.theme-toggle .ctrl-icon svg{
  stroke:var(--blue);
}
[data-theme="dark"] .theme-toggle .ctrl-icon svg{
  stroke:#facc15;
}
.logout .ctrl-icon svg{
  stroke:#ff4050;
  fill:none;
}

.ctrl-label{
  max-width:0;
  opacity:0;
  white-space:nowrap;
  overflow:hidden;
  font:600 12px "DM Mono",monospace;
  letter-spacing:.8px;
  margin-left:0;
  color:var(--ctrl-text);
  transition:max-width .3s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity .22s ease,
              margin-left .3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.ctrl-btn:hover{
  padding:0 16px 0 13px;
  transform:translateY(-2px);
  border-color:var(--blue);
  box-shadow:0 6px 20px var(--blue-glow);
}
.ctrl-btn:hover .ctrl-label{
  max-width:95px;
  opacity:1;
  margin-left:8px;
}
.logout:hover{
  border-color:rgba(255,64,80,.5);
  box-shadow:0 6px 20px rgba(255,64,80,.25);
}

/* Thinner Draggable Navigation Bar */
.nav{
  position:fixed;
  right:88px;
  top:88px;
  width:max-content;
  min-width:380px;
  padding:7px 12px;
  display:flex;
  gap:4px;
  align-items:center;
  background:var(--nav-bg);
  border:1px solid var(--nav-border);
  backdrop-filter:blur(18px);
  border-radius:12px;
  box-shadow:0 8px 32px rgba(57,189,242,.20);
  z-index:50;
  cursor:grab;
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px) scale(.97);
  transition:.22s;
}
.nav.open{opacity:1;visibility:visible;transform:none}
.nav.dragging{cursor:grabbing}
.nav:hover{z-index:100}

/* Navbar buttons: light-blue subtle glow on hover */
.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  white-space:nowrap;
  color:var(--nav-link);
  font:600 12px "DM Mono",monospace;
  letter-spacing:1.4px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid transparent;
  transition:all .2s ease;
}
.nav a:hover{
  background:rgba(57,189,242,.15);
  color:var(--blue2);
  border-color:rgba(57,189,242,.55);
  box-shadow:0 0 16px rgba(57,189,242,.45), inset 0 0 8px rgba(57,189,242,.15);
  transform:translateY(-1px);
}
.nav a.active{
  background:#e8f8fd;
  color:#079ed5;
  border-color:rgba(57,189,242,.4);
}
[data-theme="dark"] .nav a.active{
  background:rgba(56,189,248,.18);
  color:#38bdf8;
  border-color:rgba(56,189,248,.45);
}

/* Explore About Us: Arrow pointing RIGHT */
.explore{
  position:fixed;
  left:50%;
  bottom:26px;
  transform:translateX(-50%);
  z-index:20;
  color:#fff;
  font:600 12px "DM Mono",monospace;
  letter-spacing:2px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 22px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(14px);
  border-radius:30px;
  cursor:pointer;
  transition:all .25s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
[data-theme="dark"] .explore{
  background:rgba(24,24,22,.55);
  border-color:rgba(56,189,248,.4);
  color:#f4f4f5;
}
.explore:hover{
  background:rgba(255,255,255,.92);
  color:#075985;
  transform:translateX(-50%) translateY(-3px);
  box-shadow:0 8px 30px rgba(57,189,242,.45);
}
[data-theme="dark"] .explore:hover{
  background:rgba(28,28,26,.95);
  color:#38bdf8;
  box-shadow:0 8px 30px rgba(56,189,248,.35);
}
.explore .explore-arrow{
  animation:bounceRight 1.6s infinite ease-in-out;
  display:inline-block;
  font-size:14px;
  margin-left:4px;
}
@keyframes bounceRight{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(5px)}
}

.arrows{position:fixed !important;bottom:24px !important;right:28px !important;display:flex;gap:8px;z-index:9999 !important}
.arrow{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.8);
  color:#1c596d;
  border-radius:50% !important;
  cursor:pointer;
  font-size:20px;
  display:grid;
  place-items:center;
  transition:.2s;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}
[data-theme="dark"] .arrow{
  background:rgba(26,26,24,.85);
  border-color:rgba(56,189,248,.35);
  color:#38bdf8;
}
.arrow:hover{background:#fff;transform:translateY(-2px)}
[data-theme="dark"] .arrow:hover{background:#1f1f1d;color:#7dd3fc}

/* Wave/Ripple Swipe Transition Overlay */
.ocean-swipe-wave{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10001;overflow:hidden}
.ocean-swipe-wave::before{content:"";position:absolute;top:-20%;width:140vw;height:140vh;background:radial-gradient(ellipse at center, rgba(57,189,242,0.85) 0%, rgba(13,169,223,0.6) 40%, rgba(3,105,161,0.2) 70%, transparent 100%);box-shadow:0 0 80px rgba(57,189,242,0.7);filter:blur(6px)}
.ocean-swipe-wave.swipe-left::before{left:100vw;animation:waveWashLeft 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
.ocean-swipe-wave.swipe-right::before{right:100vw;animation:waveWashRight 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
@keyframes waveWashLeft{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(-220vw) scaleX(1.2);opacity:0}}
@keyframes waveWashRight{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(220vw) scaleX(1.2);opacity:0}}

/* Center the Hero Composition; keep proportions */
.content{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  color:#fff;
  text-align:center;
  width:90%;
  max-width:850px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-shadow:0 2px 10px rgba(0,0,0,.45);
  pointer-events:none;
}
.kicker{
  font:500 13px "DM Mono", "Nirmala UI", sans-serif;
  letter-spacing:4px;
  margin-bottom:20px;
  min-height:24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:opacity .3s ease,transform .3s ease;
}
h1{font:400 clamp(55px,7vw,110px)/.87 "Playfair Display",serif;letter-spacing:-5px}
.sub{font:18px "Playfair Display",serif;margin-top:22px}

@media(max-width:700px){
  .brand-bar{top:16px;left:16px}
  .brand-bar .logo{width:42px;height:42px}
  .brand-title{font-size:13px}
  .actions{right:16px;top:16px;gap:8px}
  .nav{right:16px;top:75px;width:calc(100vw - 32px);min-width:auto}
  h1{font-size:17vw}
  .explore{bottom:18px}
  .arrows{right:16px;bottom:16px}
}
</style>
</head>

<body class="page-enter">
<canvas id="cursorTrailCanvas"></canvas>

<main class="page">

<div class="hero-video">
<iframe src="https://www.youtube.com/embed/ALbM9_cF7YQ?autoplay=1&mute=1&controls=0&loop=1&playlist=ALbM9_cF7YQ&start=10&end=40&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0" allow="autoplay" tabindex="-1"></iframe>
</div>

<div class="overlay"></div>

<!-- Brand Bar (Logo + Synchronized Rotating Sagar Mitra aligned to navbar height) -->
<a href="main.html" class="brand-bar" aria-label="Sagar Mitra Home">
  <img src="assets/logo.svg" onerror="this.onerror=null;this.src='assets/logo.png';" class="logo" alt="Sagar Mitra">
  <span class="brand-title" id="navBrandTitle">SAGAR MITRA</span>
</a>

<!-- Top-Right Navbar Expanding Controls: Navigation, Theme Toggle, Logout -->
<div class="actions">

  <button class="ctrl-btn nav-trigger" id="navTrigger" aria-label="Open navigation">
    <span class="ctrl-icon">
      <svg viewBox="0 0 40 40" fill="none" stroke-width="2.5">
        <path d="M4 25c5-11 12-15 18-10 4 3 6 8 14 3"/>
        <path d="M4 30c7-7 12-8 18-4 5 3 9 3 14-2"/>
      </svg>
    </span>
    <span class="ctrl-label">Navigation</span>
  </button>

  <button class="ctrl-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="ctrl-icon" id="themeIconSlot">
      <!-- Injected by JS: Sun or Moon SVG -->

  <button class="ctrl-btn logout" id="logout" aria-label="Log out">

        <path d="M25 16H11"/>
      </svg>
    </span>

<nav class="nav" id="nav">

</nav>

<!-- Centered Hero Composition -->

</a>

</main>

<script>
// ============================================================
// 1. THEME MANAGEMENT (Light / Dark - Claude charcoal)
// ============================================================
function initTheme(){
  const saved = localStorage.getItem("sagarMitraTheme") || "light";
  applyTheme(saved);
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("sagarMitraTheme", theme);

  const iconSlot = document.getElementById("themeIconSlot");
  const label = document.getElementById("themeLabel");
  if(theme === "dark"){
    if(iconSlot) iconSlot.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    if(label) label.textContent = "Light Mode";
  } else {
    if(iconSlot) iconSlot.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    if(label) label.textContent = "Dark Mode";
  }
}

const themeBtn = document.getElementById("themeToggle");
if(themeBtn){
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  };
}
initTheme();

// ============================================================
// 2. ROTATING "SAGAR MITRA" ACROSS 10 INDIAN LANGUAGES (Every 2s)
// English, Hindi, Marathi, Bengali, Gujarati, Tamil, Telugu, Kannada, Malayalam, Odia
// ============================================================
const sagarTranslations = [
  { lang: "English", text: "SAGAR MITRA" },
  { lang: "Hindi", text: "सागर मित्र" },
  { lang: "Marathi", text: "सागर मित्र" },
  { lang: "Bengali", text: "সাগর মিত্র" },
  { lang: "Gujarati", text: "સાગર મિત્ર" },
  { lang: "Tamil", text: "சாகர் மித்ரா" },
  { lang: "Telugu", text: "సాగర్ మిత్ర" },
  { lang: "Kannada", text: "ಸಾಗರ ಮಿತ್ರ" },
  { lang: "Malayalam", text: "സാഗർ മിത്ര" },
  { lang: "Odia", text: "ସାଗର ମିତ୍ର" }
];

let langIdx = 0;
setInterval(() => {
  langIdx = (langIdx + 1) % sagarTranslations.length;
  const nextItem = sagarTranslations[langIdx];

  const heroEl = document.getElementById("heroLangTitle");
  const navEl = document.getElementById("navBrandTitle");

  [heroEl, navEl].forEach(el => {
    if(!el) return;
    el.style.opacity = "0";
    el.style.transform = "translateY(-5px)";
  });

  setTimeout(() => {
    [heroEl, navEl].forEach(el => {
      if(!el) return;
      el.textContent = nextItem.text;
      el.style.opacity = "1";
      el.style.transform = "translateY(0)";
    });
  }, 280);
}, 2000);

// ============================================================
// 3. SUBTLE LIGHT-BLUE CURSOR GLOW / PARTICLE TRAIL
// ============================================================
(function initCursorTrail(){
  const canvas = document.getElementById("cursorTrailCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const particles = [];
  const maxParticles = 35;

  window.addEventListener("pointermove", e => {
    for(let i = 0; i < 2; i++){
      if(particles.length < maxParticles){
        particles.push({
          x: e.clientX + (Math.random() - 0.5) * 6,
          y: e.clientY + (Math.random() - 0.5) * 6,
          size: Math.random() * 4.5 + 2.5,
          alpha: 0.65,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6
        });
      }
    }
  });

  function render(){
    ctx.clearRect(0, 0, width, height);

    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.022;
      p.size *= 0.96;

      if(p.alpha <= 0 || p.size <= 0.5){
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(57, 189, 242, ${p.alpha})`;
      ctx.shadowColor = "rgba(57, 189, 242, 0.75)";
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();

// ============================================================
// 4. PAGE TRANSITIONS & NAVIGATION
// ============================================================
const pages=["main.html","about.html","map.html","chatbot.html"];
const current=pages.indexOf(location.pathname.split("/").pop())<0?0:pages.indexOf(location.pathname.split("/").pop());
let nav=document.getElementById("nav"),trigger=document.getElementById("navTrigger");
let dragging=false,ox=0,oy=0,startX=0,startY=0;

trigger.onclick=()=>nav.classList.toggle("open");

document.getElementById("logout").onclick=()=>{
  localStorage.removeItem("sagarMitraLoggedIn");
  document.body.classList.add("page-exit");
  setTimeout(()=>location.href="login.html",450);
};

let transitioning=false;
function triggerWaveTransition(dir, targetUrl){
  let wave = document.getElementById("oceanWaveOverlay");
  if(!wave){
    wave = document.createElement("div");
    wave.id = "oceanWaveOverlay";
    document.body.appendChild(wave);
  }
  wave.className = "ocean-swipe-wave " + (dir > 0 ? "swipe-left" : "swipe-right");

  document.body.style.transition = "transform 0.45s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.45s ease";
  document.body.style.transform = `translateX(${dir > 0 ? "-10vw" : "10vw"})`;
  document.body.style.opacity = "0";

  setTimeout(() => { location.href = targetUrl; }, 420);
}

function go(dir){
  const n=current+dir;
  if(n<0||n>=pages.length||transitioning)return;
  transitioning=true;
  triggerWaveTransition(dir, pages[n]);
}

document.getElementById("next").onclick=()=>go(1);
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("exploreBtn").onclick=(e)=>{
  e.preventDefault();
  go(1);
};

// Keyboard navigation
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="PageDown"||(e.ctrlKey&&e.key==="ArrowRight")){
    e.preventDefault();
    go(1);
  } else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp"||(e.ctrlKey&&e.key==="ArrowLeft")){
    e.preventDefault();
    go(-1);
  }
});

// CTRL + 2-FINGER SWIPE: Horizontal page navigation
let swipeLock=false;
window.addEventListener("wheel",e=>{
  if(!e.ctrlKey) return;
  if(Math.abs(e.deltaX) < 16 || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;

  e.preventDefault();
  if(swipeLock || transitioning) return;

  const dir = e.deltaX > 0 ? 1 : -1;
  const n = current + dir;
  if(n < 0 || n >= pages.length) return;

  swipeLock = true;
  transitioning = true;
  triggerWaveTransition(dir, pages[n]);
},{passive:false});

// Touch swipe navigation for mobile & trackpads
let touchY=0, touchX=0;
window.addEventListener("touchstart",e=>{
  touchY=e.touches[0].clientY;
  touchX=e.touches[0].clientX;
},{passive:true});
window.addEventListener("touchend",e=>{
  const dy=touchY-e.changedTouches[0].clientY;
  const dx=touchX-e.changedTouches[0].clientX;
  if(dy>45||dx>45) go(1);
  else if(dy<-45||dx<-45) go(-1);
},{passive:true});

// Floating draggable navigation bar
nav.addEventListener("pointerdown",e=>{
  if(e.target.closest("a"))return;
  dragging=true;
  nav.classList.add("dragging");
  startX=e.clientX;
  startY=e.clientY;
  const r=nav.getBoundingClientRect();
  ox=r.left;
  oy=r.top;
  nav.setPointerCapture(e.pointerId);
});

nav.addEventListener("pointermove",e=>{
  if(!dragging)return;
  nav.style.left=ox+(e.clientX-startX)+"px";
  nav.style.top=oy+(e.clientY-startY)+"px";
  nav.style.right="auto";
});

nav.addEventListener("pointerup",()=>{
  if(!dragging)return;
  dragging=false;
  nav.classList.remove("dragging");
  localStorage.setItem("navX",nav.offsetLeft);
  localStorage.setItem("navY",nav.offsetTop);
});

const nx=localStorage.getItem("navX"),ny=localStorage.getItem("navY");
if(nx&&ny){
  nav.style.left=nx+"px";
  nav.style.top=ny+"px";
  nav.style.right="auto";
}
</script>
