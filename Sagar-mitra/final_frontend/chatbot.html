<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sagar Mitra — Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root {
  --blue: #39bdf2;
  --blue2: #0da9df;
  --blue-hover: #0da9df;
  --blue-glow: rgba(57, 189, 242, 0.45);
  --ink: #101820;
  --muted: #657783;
  --line: #ccecf7;
  --bg: #ffffff;
  --ctrl-bg: rgba(255, 255, 255, 0.85);
  --ctrl-border: rgba(57, 189, 242, 0.4);
  --ctrl-text: #101820;
  --nav-bg: rgba(255, 255, 255, 0.82);
  --nav-border: rgba(57, 189, 242, 0.65);
  --nav-link: #263943;
  --brand-text: #101820;
}

[data-theme="dark"] {
  --blue: #38bdf8;
  --blue2: #0284c7;
  --blue-hover: #38bdf8;
  --blue-glow: rgba(56, 189, 248, 0.5);
  --ink: #f4f4f5;
  --muted: #9ca3af;
  --line: rgba(56, 189, 248, 0.3);
  --bg: #141413;
  --ctrl-bg: rgba(26, 26, 24, 0.88);
  --ctrl-border: rgba(56, 189, 248, 0.35);
  --ctrl-text: #f4f4f5;
  --nav-bg: rgba(24, 24, 22, 0.90);
  --nav-border: rgba(56, 189, 248, 0.45);
  --nav-link: #d4d4d8;
  --brand-text: #f4f4f5;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;transition:background .3s ease,color .3s ease}
body{animation:i .65s ease both}@keyframes i{from{opacity:0;transform:translateX(8vw)}to{opacity:1;transform:none}}
.page{width:100vw;height:100vh;position:relative}

/* Subtle light-blue cursor trail */
#cursorTrailCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:99998;
}

/* Brand Bar with Logo */
.brand-bar{
  position:fixed;
  top:27px;
  left:28px;
  height:48px;
  display:inline-flex;
  align-items:center;
  gap:12px;
  z-index:30;
  text-decoration:none;
}
.brand-bar .logo{
  width:48px;
  height:48px;
  object-fit:contain;
  filter:drop-shadow(0 2px 8px rgba(57,189,242,.3));
  transition:transform .2s ease;
}
.brand-bar:hover .logo{transform:scale(1.05)}
.brand-title{
  height:48px;
  display:inline-flex;
  align-items:center;
  font:600 15px/1 "DM Mono", monospace;
  letter-spacing:2px;
  color:var(--brand-text);
  white-space:nowrap;
  user-select:none;
}

/* Expanding Top-Right Controls */
.actions{
  position:fixed;
  top:27px;
  right:28px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:40;
}
.ctrl-btn{
  height:48px;
  border-radius:24px;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  backdrop-filter:blur(14px);
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  color:var(--ctrl-text);
  overflow:hidden;
  transition:padding .3s cubic-bezier(0.2, 0.8, 0.2, 1),
              background .25s ease,
              border-color .25s ease,
              box-shadow .25s ease,
              transform .2s ease;
  white-space:nowrap;
  user-select:none;
}
.ctrl-icon{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  transition:transform .2s ease;
}
.ctrl-icon svg{width:22px;height:22px}
.nav-trigger .ctrl-icon svg{stroke:var(--blue)}
.theme-toggle .ctrl-icon svg{stroke:var(--blue)}
[data-theme="dark"] .theme-toggle .ctrl-icon svg{stroke:#facc15}
.logout .ctrl-icon svg{stroke:#ff4050;fill:none}

.ctrl-label{
  max-width:0;
  opacity:0;
  white-space:nowrap;
  overflow:hidden;
  font:600 12px "DM Mono",monospace;
  letter-spacing:.8px;
  margin-left:0;
  color:var(--ctrl-text);
  transition:max-width .3s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity .22s ease,
              margin-left .3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.ctrl-btn:hover{
  padding:0 16px 0 13px;
  transform:translateY(-2px);
  border-color:var(--blue);
  box-shadow:0 6px 20px var(--blue-glow);
}
.ctrl-btn:hover .ctrl-label{
  max-width:95px;
  opacity:1;
  margin-left:8px;
}
.logout:hover{
  border-color:rgba(255,64,80,.5);
  box-shadow:0 6px 20px rgba(255,64,80,.25);
}

/* Thinner Draggable Navigation Bar */
.nav{
  position:fixed;
  right:88px;
  top:88px;
  width:max-content;
  min-width:380px;
  padding:7px 12px;
  display:flex;
  gap:4px;
  align-items:center;
  background:var(--nav-bg);
  backdrop-filter:blur(18px);
  border:1px solid var(--nav-border);
  border-radius:12px;
  box-shadow:0 8px 30px rgba(57,189,242,.2);
  z-index:50;
  cursor:grab;
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px) scale(.97);
  transition:.2s;
}
.nav.open{opacity:1;visibility:visible;transform:none}
.nav.dragging{cursor:grabbing}
.nav:hover{z-index:100}

/* Navbar buttons: light-blue subtle glow on hover */
.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  white-space:nowrap;
  color:var(--nav-link);
  font:600 12px "DM Mono",monospace;
  letter-spacing:1.4px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid transparent;
  transition:all .2s ease;
}
.nav a:hover{
  background:rgba(57,189,242,.15);
  color:var(--blue-hover);
  border-color:rgba(57,189,242,.55);
  box-shadow:0 0 16px rgba(57,189,242,.45), inset 0 0 8px rgba(57,189,242,.15);
  transform:translateY(-1px);
}
.nav a.active{
  background:#e8f8fd;
  color:#079ed5;
  border-color:rgba(57,189,242,.4);
}
[data-theme="dark"] .nav a.active{
  background:rgba(56,189,248,.18);
  color:#38bdf8;
  border-color:rgba(56,189,248,.45);
}

.content{height:100%;display:grid;place-items:center;text-align:center}
.kicker{font:500 12px "DM Mono",monospace;letter-spacing:4px;color:var(--blue);margin-bottom:22px}
h1{font:400 clamp(70px,11vw,150px)/.85 "Playfair Display",serif;letter-spacing:-6px}
p{font:20px "Playfair Display",serif;color:var(--muted);margin-top:28px}

.arrows{position:fixed !important;bottom:24px !important;right:28px !important;display:flex;gap:8px;z-index:9999 !important}
.arrow{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  background:var(--ctrl-bg);
  color:#168fb9;
  border-radius:50% !important;
  font-size:20px;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}
[data-theme="dark"] .arrow{
  background:rgba(26,26,24,.85);
  border-color:rgba(56,189,248,.35);
  color:#38bdf8;
}
.arrow:hover{background:#f0fbff;transform:translateY(-2px)}
[data-theme="dark"] .arrow:hover{background:#1f1f1d;color:#7dd3fc}

.explore{position:fixed;bottom:29px;left:50%;transform:translateX(-50%);font:11px "DM Mono",monospace;letter-spacing:2px;color:var(--muted)}

/* Wave/Ripple Swipe Transition Overlay */
.ocean-swipe-wave{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10001;overflow:hidden}
.ocean-swipe-wave::before{content:"";position:absolute;top:-20%;width:140vw;height:140vh;background:radial-gradient(ellipse at center, rgba(57,189,242,0.85) 0%, rgba(13,169,223,0.6) 40%, rgba(3,105,161,0.2) 70%, transparent 100%);box-shadow:0 0 80px rgba(57,189,242,0.7);filter:blur(6px)}
.ocean-swipe-wave.swipe-left::before{left:100vw;animation:waveWashLeft 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
.ocean-swipe-wave.swipe-right::before{right:100vw;animation:waveWashRight 0.48s cubic-bezier(0.25, 1, 0.3, 1) forwards}
@keyframes waveWashLeft{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(-220vw) scaleX(1.2);opacity:0}}
@keyframes waveWashRight{0%{transform:translateX(0) scaleX(0.4);opacity:0}30%{opacity:0.95}100%{transform:translateX(220vw) scaleX(1.2);opacity:0}}
</style>
</head>

<body>
<canvas id="cursorTrailCanvas"></canvas>

<div class="page">

<!-- Brand Bar (Logo + Title) -->
<a href="main.html" class="brand-bar" aria-label="Sagar Mitra Home">
  <img src="assets/logo.svg" onerror="this.onerror=null;this.src='assets/logo.png';" class="logo" alt="Sagar Mitra">
  <span class="brand-title">SAGAR MITRA</span>
</a>

<!-- Top-right Action Buttons: Navigation, Theme Toggle, Logout -->
<div class="actions">
  <button class="ctrl-btn nav-trigger" id="trigger" aria-label="Navigation">
    <span class="ctrl-icon">
      <svg viewBox="0 0 40 40" fill="none" stroke-width="2.5">
        <path d="M4 25c5-11 12-15 18-10 4 3 6 8 14 3"/>
        <path d="M4 30c7-7 12-8 18-4 5 3 9 3 14-2"/>
      </svg>
    </span>
    <span class="ctrl-label">Navigation</span>
  </button>

  <button class="ctrl-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="ctrl-icon" id="themeIconSlot"></span>
    <span class="ctrl-label" id="themeLabel">Theme</span>
  </button>

  <button class="ctrl-btn logout" id="logout" aria-label="Log out">
    <span class="ctrl-icon">
      <svg viewBox="0 0 32 32" stroke-width="2">
        <path d="M13 5H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h6"/>
        <path d="M18 10l7 6-7 6"/>
        <path d="M25 16H11"/>
      </svg>
    </span>
    <span class="ctrl-label">Log Out</span>
  </button>
</div>

<nav class="nav" id="nav">
  <a href="main.html">HOME</a>
  <a href="about.html">ABOUT US</a>
  <a href="map.html">MAP</a>
  <a href="chatbot.html" class="active">CHATBOT</a>
</nav>

<section class="content">
  <div>
    <div class="kicker">SAGAR MITRA</div>
    <h1>Chatbot</h1>
    <p>Your ocean assistant will live here.</p>
  </div>
</section>

<div class="explore">SLIDE TO EXPLORE →</div>

<div class="arrows">
  <button class="arrow" id="prev" aria-label="Previous page">←</button>
  <button class="arrow" id="next" aria-label="Next page">→</button>
</div>

</div>

<script>
// ============================================================
// 1. THEME MANAGEMENT (Light / Dark - Claude charcoal)
// ============================================================
function initTheme(){
  const saved = localStorage.getItem("sagarMitraTheme") || "light";
  applyTheme(saved);
}

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("sagarMitraTheme", theme);

  const iconSlot = document.getElementById("themeIconSlot");
  const label = document.getElementById("themeLabel");
  if(theme === "dark"){
    if(iconSlot) iconSlot.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    if(label) label.textContent = "Light Mode";
  } else {
    if(iconSlot) iconSlot.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    if(label) label.textContent = "Dark Mode";
  }
}

const themeBtn = document.getElementById("themeToggle");
if(themeBtn){
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  };
}
initTheme();

// ============================================================
// 2. SUBTLE LIGHT-BLUE CURSOR GLOW / PARTICLE TRAIL
// ============================================================
(function initCursorTrail(){
  const canvas = document.getElementById("cursorTrailCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const particles = [];
  const maxParticles = 35;

  window.addEventListener("pointermove", e => {
    for(let i = 0; i < 2; i++){
      if(particles.length < maxParticles){
        particles.push({
          x: e.clientX + (Math.random() - 0.5) * 6,
          y: e.clientY + (Math.random() - 0.5) * 6,
          size: Math.random() * 4.5 + 2.5,
          alpha: 0.65,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6
        });
      }
    }
  });

  function render(){
    ctx.clearRect(0, 0, width, height);

    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.022;
      p.size *= 0.96;

      if(p.alpha <= 0 || p.size <= 0.5){
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(57, 189, 242, ${p.alpha})`;
      ctx.shadowColor = "rgba(57, 189, 242, 0.75)";
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();

// ============================================================
// 3. PAGE NAVIGATION
// ============================================================
const pages=["main.html","about.html","map.html","chatbot.html"],current=3,nav=document.getElementById("nav");
trigger.onclick=()=>nav.classList.toggle("open");
logout.onclick=()=>{localStorage.removeItem("sagarMitraLoggedIn");location.href="login.html"};

let transitioning=false;
function triggerWaveTransition(dir, targetUrl){
  let wave = document.getElementById("oceanWaveOverlay");
  if(!wave){
    wave = document.createElement("div");
    wave.id = "oceanWaveOverlay";
    document.body.appendChild(wave);
  }
  wave.className = "ocean-swipe-wave " + (dir > 0 ? "swipe-left" : "swipe-right");

  document.body.style.transition = "transform 0.45s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.45s ease";
  document.body.style.transform = `translateX(${dir > 0 ? "-10vw" : "10vw"})`;
  document.body.style.opacity = "0";

  setTimeout(() => { location.href = targetUrl; }, 420);
}

function go(d){
  let n=current+d;
  if(n<0||n>=pages.length||transitioning)return;
  transitioning=true;
  triggerWaveTransition(d, pages[n]);
}
prev.onclick=()=>go(-1);
next.onclick=()=>go(1);

document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    e.preventDefault();
    go(e.key==="ArrowRight"?1:-1);
  }
});

// CTRL + 2-FINGER SWIPE: Horizontal page navigation
let swipeLock = false;
window.addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  if (Math.abs(e.deltaX) < 16 || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;

  e.preventDefault();
  if (swipeLock || transitioning) return;

  const dir = e.deltaX > 0 ? 1 : -1;
  const n = current + dir;
  if (n < 0 || n >= pages.length) return;

  swipeLock = true;
  transitioning = true;
  triggerWaveTransition(dir, pages[n]);
}, { passive: false });

let drag=false,sx,sy,ox,oy;
nav.onpointerdown=e=>{
  if(e.target.closest("a"))return;
  drag=true;
  sx=e.clientX;
  sy=e.clientY;
  let r=nav.getBoundingClientRect();
  ox=r.left;
  oy=r.top;
  nav.setPointerCapture(e.pointerId);
};
nav.onpointermove=e=>{
  if(drag){
    nav.style.left=ox+e.clientX-sx+"px";
    nav.style.top=oy+e.clientY-sy+"px";
    nav.style.right="auto";
  }
};
nav.onpointerup=()=>{
  drag=false;
  localStorage.setItem("navX",nav.offsetLeft);
  localStorage.setItem("navY",nav.offsetTop);
};
if(localStorage.navX){
  nav.style.left=localStorage.navX+"px";
  nav.style.top=localStorage.navY+"px";
  nav.style.right="auto";
}
</script>
</body>
</html>
